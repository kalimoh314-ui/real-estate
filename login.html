<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
     
    
    
    <title> عقار </title>
     <link rel="preconnect" href="https://googleapis.com">
     <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            height: 100vh;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            width: 100%; max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .login-title { font-size: 26px; font-weight: 900; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .form-group input { 
            padding: 14px; font-size: 15px; font-family: inherit;
            border: 1px solid #dcdde1; border-radius: 12px;
            background-color: #f8f9fa; outline: none;
        }
        .form-group input:focus { border-color: #3498db; background-color: #fff; }
        .submit-btn {
            width: 100%; padding: 15px; font-size: 16px; font-weight: 700; font-family: inherit;
            background: linear-gradient(135deg, #2980b9, #3498db); color: white; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 10px; box-shadow: 0 5px 15px rgba(52,152,219,0.3);
        }
        .cancel-btn {
            display: block; text-align: center; margin-top: 15px;
            color: #7f8c8d; text-decoration: none; font-size: 14px; font-weight: 500;
        }
       
    </style>
</head>
<body>

<div class="login-container">
        <div class="login-title">تسجيل الدخول </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة السر:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">دخول</button>
            <a href="index.html" class="cancel-btn">إلغاء والعودة للرئيسية</a>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            
            // جلب الاسم الأول قبل علامة @
            const username = email.split('@')[0];
            
            // حفظ البيانات في المتصفح لتحديث الصفحة الرئيسية تلقائياً
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('username', username);

            alert("مرحباً بك! تم تسجيل دخولك بنجاح.");
            // إعادة توجيه المستخدم تلقائياً للصفحة الرئيسية بعد نجاح الدخول
            window.location.href = 'index.html';
        });
    </script>

          

</body>
</html>
