    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> عقار  </title>
     <!-- استيراد خط Tajawal الأنيق من جوجل -->
    <link rel="preconnect" href="https://googleapis.com">
    
<body>
 <style>
    /* إعدادات الصفحة العامة */ 
    html, body { margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        font-family: 'Segoe UI', 
        Tahoma, Geneva, Verdana, sans-serif; 
        overflow: hidden; 
        /* لمنع ظهور أشرطة التمرير بسبب الخلفية */ 
    } /* ==================== كود الخلفية المتحركة بـ CSS ==================== */ 
    .background-slider { position: fixed; 
        top: 0; 
        left: 0; width: 100%; 
        height: 100%; 
        z-index: -1; 
        /* لجعل الخلفية خلف محتوى الموقع دائماً */ 
        background-size: cover; 
        background-position: center; 
        background-repeat: no-repeat; 
        /* استدعاء الأنيميشن: المدة الإجمالية 15 ثانية (5 ثوانٍ لكل صورة) وتتكرر للأبد */ 
        animation: changeBackground 15s infinite ease-in-out; } 
        @keyframes changeBackground { 
            /* الصورة الأولى: تعرض من البداية وحتى 33% من الوقت الإجمالي */ 
            0%, 28% { background-image: url('https://unsplash.com'); } 
            /* تأثير الانتقال (Fade) بين الصورة الأولى والثانية */ 
            33%, 61% { background-image: url('https://unsplash.com'); } 
            /* تأثير الانتقال (Fade) بين الصورة الثانية والثالثة */ 
            66%, 95% { background-image: url('https://unsplash.com'); } 
            /* العودة للصورة الأولى بسلاسة عند نهاية الـ 100% */ 
            100% { background-image: url('https://unsplash.com'); 
        } } /* ==================== محتوى فوق الخلفية (مثال) ==================== */ 
        .content-box { position: absolute; top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px); 
            /* تأثير زجاجي ضبابي للمحتوى */ 
            padding: 40px; border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            max-width: 400px; width: 90%; 
        } h1 { color: #2c3e50; margin-bottom: 15px; 
        } p { color: #555; 
            line-height: 1.6; }
  /* تعديل تصميم زر التبديل للوضع الليلي ليكون أجمل */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e2e8f0; transition: .4s; border-radius: 30px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input:checked + .slider { background: var(--gradient); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        :root {
            --bg-color: #f5f7fa;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --accent-color: #3498db;
            --sidebar-bg: #ffffff;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --gradient: linear-gradient(135deg, #2980b9, #3498db);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f5f7fa;
            --border-color: #2c3e50;
            --card-bg: #1e1e1e;
            --sidebar-bg: #1e1e1e;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --gradient: linear-gradient(135deg, #1f4068, #162447);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            transition: background 0.4s, color 0.4s;
        }


        /* الشريط العلوي مع زر تسجيل الدخول */
        .top-bar {
            width: 100%; height: 70px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; 
            justify-content: space-between; /* لتوزيع العناصر على الأطراف */
            align-items: center;
            padding: 0 30px; box-sizing: border-box;
            box-shadow: var(--shadow);
        }
        .menu-icon {
            font-size: 28px; cursor: pointer; user-select: none;
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 12px;
            background-color: var(--bg-color);
        }
        
        /* زر تسجيل الدخول الجمالي */
        .login-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
        }

        .logo-area { text-align: center; margin-top: 40px; margin-bottom: 25px; }
        .main-title {
            font-size: 75px; font-weight: 900; display: inline-block;
            background: var(--gradient); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; letter-spacing: 2px;
            position: relative;
        }
        .main-title::after {
            content: ''; position: absolute; bottom: -5px; left: 20%;
            width: 60%; height: 4px; background: var(--gradient); border-radius: 10px;
        }
         /* ==================== تصميم نافذة تسجيل الدخول المنبثقة (Modal) ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1; pointer-events: auto;
        }
        .modal-box {
            background-color: var(--card-bg);
            padding: 40px;
            width: 90%; max-width: 400px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            box-sizing: border-box;
        }
        .modal-overlay.show .modal-box {
            transform: translateY(0);
        }
        
        

       
       
       
       
    </style>
 
 
        
           
        
        
       
      <body>
        <script>
        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
        }

        function switchTheme(isDark) {
            if(isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        const dictionary = {
            ar: {
                logo: "عقار",
                ind: ["قسم", "عقار صناعي"],
                com: ["قسم", "عقار تجاري"],
                res: ["قسم", "عقار منازل"],
                agr: ["قسم", "عقار فلاحي"],
                sale: "عنصر بيع",
                lang: "اللغة",
                theme: "الوضع الليلي"
                  } }  
                  </script>  
                  
            <!-- عنصر الخلفية المتحركة --> 
            <div class="background-slider"></div> 
            <!-- محتوى موقعك يكتب هنا --> 
            <div class="content-box"> 
                <h1>مرحباً بك في موقعنا</h1> 
                <p>تتغير الخلفية في هذا الموقع تلقائياً كل 5 ثوانٍ بفضل تأثيرات CSS الاحترافية والناعمة.</p> 
            </div>   
    
    </body>
